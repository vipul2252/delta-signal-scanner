name: Delta Signal Scanner

on:
  schedule:
    - cron: "*/15 * * * *"   # har 15 minute scan (GitHub kabhi kabhi 5-10 min late chalata hai)
    - cron: "31 2 * * *"     # roz 8:01 AM IST summary
  workflow_dispatch:
    inputs:
      mode:
        description: "scan / summary / test"
        default: "scan"

concurrency:
  group: delta-scanner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_VOLUME_USD: ${{ vars.MIN_VOLUME_USD }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          FUNDING_ABS: ${{ vars.FUNDING_ABS }}
          EXCLUDE_SYMBOLS: ${{ vars.EXCLUDE_SYMBOLS }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "31 2 * * *" ]; then MODE=summary; else MODE=scan; fi
          fi
          python scanner.py "$MODE"
